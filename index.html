<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prefection Projects</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d0d0d; color: #fff; }
      main { width: min(760px, calc(100% - 40px)); }
      h1 { margin-bottom: 8px; }
      p { color: #aaa; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
      a { padding: 22px; border: 1px solid #333; border-radius: 14px; background: #191919; color: inherit; text-decoration: none; }
      a:hover { border-color: #777; transform: translateY(-1px); }
      strong { display: block; font-size: 18px; margin-bottom: 6px; }
      span { color: #aaa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Prefection Projects</h1>
      <p>Chọn trang bạn muốn mở.</p>
      <div class="grid">
        <a href="./project1/"><strong>Project 1</strong><span>Prefection Manpower Intelligence</span></a>
        <a href="./project3/"><strong>Project 3</strong><span>Prefection project dashboard</span></a>
      </div>
    </main>
  </body>
</html>
